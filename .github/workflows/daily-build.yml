name: Daily build

# Doors are gated at build time, so the site has to be rebuilt each morning in
# December for the next one to appear. 23:05 UTC is 00:05 in Berlin during CET
# — GitHub cron has no timezone, so the offset is baked into the schedule.
on:
  schedule:
    - cron: "5 23 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_date:
        description: "Build as if it were this date (YYYY-MM-DD)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          OAC_TODAY: ${{ inputs.preview_date }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
